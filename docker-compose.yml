services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: registry
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://platform:devpassword@db:5432/registry
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
